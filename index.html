    <style>
        /* Estilos del Carrusel con línea superior naranja */
        .carousel-section {
            width: 100%;
            background: #ffffff;
            padding: 0;
            overflow: hidden;
            border-top: 10px solid #ff660000; /* Franja naranja arriba */
            margin-bottom: 15px;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }
        .carousel-slide {
            min-width: 100%;
            box-sizing: border-box;
            position: relative;
        }
        .carousel-slide img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        /* Puntos indicadores del carrusel */
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 8px 0;
            background: #fff;
        }
        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .indicator.active {
            background: #ff6600;
            width: 20px;
            border-radius: 4px;
        }

        /* Estilo especial para la tarjeta de "Agrega tu local" */
        .store-card.add-store {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border: 2px dashed #ff6600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .store-card.add-store:hover {
            transform: scale(1.02);
        }
        .store-card.add-store i {
            font-size: 35px;
            color: #ff6600;
            margin-bottom: 8px;
        }
        .store-card.add-store h3 {
            color: #d84315;
            font-size: 15px;
            margin: 0;
        }
        .store-card.add-store p {
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }
    </style>
</head>

    <!-- Script para manejo del modal y envío sin recargar página -->
    <script>
        function abrirModalReseña() {
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('mensajeExito').style.display = 'none';
            document.getElementById('mensajeReseña').value = '';
            document.getElementById('modalReseña').style.display = 'flex';
        }

        function cerrarModalReseña() {
            document.getElementById('modalReseña').style.display = 'none';
        }

        function enviarReseñaAnonima(event) {
            event.preventDefault();
            const form = document.getElementById('reseñaForm');
            const formData = new FormData(form);
            const btnEnviar = document.getElementById('btnEnviar');
            
            btnEnviar.innerText = 'Enviando...';
            btnEnviar.disabled = true;

            fetch('https://formsubmit.co/ajax/zorydelivery@gmail.com', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('mensajeExito').style.display = 'block';
                btnEnviar.innerText = 'Enviar';
                btnEnviar.disabled = false;
            })
            .catch(error => {
                alert('Hubo un error al enviar. Inténtalo de nuevo.');
                btnEnviar.innerText = 'Enviar';
                btnEnviar.disabled = false;
            });
        }
    </script>

    <script>
        // Lógica del Carrusel Automático
        let slideIndex = 0;
        const track = document.getElementById('carouselTrack');
        const slides = document.querySelectorAll('.carousel-slide');
        const indicators = document.querySelectorAll('.indicator');

        function updateCarousel() {
            if (!track) return;
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
            indicators.forEach((ind, i) => {
                ind.classList.toggle('active', i === slideIndex);
            });
        }

        function nextSlide() {
            slideIndex = (slideIndex + 1) % slides.length;
            updateCarousel();
        }

        function currentSlide(index) {
            slideIndex = index;
            updateCarousel();
        }

        let carouselInterval = setInterval(nextSlide, 4000);

        if (track) {
            track.addEventListener('mouseenter', () => clearInterval(carouselInterval));
            track.addEventListener('mouseleave', () => carouselInterval = setInterval(nextSlide, 4000));
        }

        // Array de datos de los locales reales
        const locales = [
            { id: "burgerland", nombre: "Burgerland", img: "burgerland.png", url: "burgerland.html" },
            { id: "Valhalla Burger", nombre: "Valhalla Burger", img: "valhalla.webp", url: "Valhalla.html" },
            { id: "Rolling Cook.html", nombre: "Rolling Cook", img: "rolling cook.webp", url: "Rolling Cook.html" },
            { id: "Absoluto.html", nombre: "Absoluto", img: "absoluto.webp", url: "Absoluto.html" },
            { id: "Home Of Burger.html", nombre: "Home Of Burger", img: "home burgers.png", url: "Home Of Burger.html" },
            { id: "Acai berry", nombre: "Acai berry", img: "Açaí berry.webp", url: "Acai berry.html" },
            { id: "Bacoa burger", nombre: "Bacoa burger", img: "bacoa.webp", url: "Bacoa burger.html" },
            { id: "Los Abuelos", nombre: "los abuelos", img: "los abuelos logo.png", url: "los abuelos.html" },
            { id: "La Estancion", nombre: "La Estacion", img: "la estacion.web.jpeg", url: "la estacion.html" }, 
            { id: "Porkys", nombre: "Porkys", img: "porkis.web.jpeg", url: "Porkys.html" },
            { id: "La Peña", nombre: "La Peña", img: "la peña-8.png", url: "la Peña.html" },
            { id: "Acai Francol", nombre: "Acai Francol", img: "acai franco web.jpeg", url: "Acai Francol.html" },
            { id: "Posada Mysko", nombre: "Posada Mysko", img: "posada mysko web.png", url: "Posada Mysko.html" },
            { id: "Lo De Capi", nombre: "Lo De Capi", img: "lo de capi web.jpeg", url: "Lo De Capi.html" },
            { id: "Hamburguesería Milu", nombre: "Hamburguesería Milu", img: "logo milu-8.png", url: "Milu.html" },
            { id: "Amandau", nombre: "Amandau", img: "amandau logo.png", url: "Amandau.html" },

            

           ];

        const container = document.getElementById('stores-container');

        function renderLocales(lista) {
            container.innerHTML = '';
            
            // Renderizar los locales normales filtrados o totales
            lista.forEach(local => {
                container.innerHTML += `
                    <div class="store-card" onclick="irAlMenu('${local.url}')">
                        <img src="${local.img}" alt="${local.nombre}">
                        <div class="store-info">
                            <h3>${local.nombre}</h3>
                        </div>
                    </div>
                `;
            });

            // Agregar las 2 tarjetas de "Agrega tu local" al final de la grilla
            for (let i = 0; i < 2; i++) {
                container.innerHTML += `
                    <div class="store-card add-store" onclick="contactarWhatsApp()">
                        <i class="fa-solid fa-store-slash"></i>
                        <h3>¡Agrega tu local!</h3>
                        <p>Únete a Zori Delivery</p>
                    </div>
                `;
            }
        }

        function irAlMenu(urlArchivo) {
            window.location.href = urlArchivo;
        }

        function contactarWhatsApp() {
            let mensaje = "¡Hola Zori Delivery! 📱 Me interesa agregar mi local a la plataforma. ¿Me podrían dar info sobre cómo funciona?";
            let urlWp = `https://wa.me/595982309464?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWp, '_blank');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = locales.filter(l => 
                l.nombre.toLowerCase().includes(texto)
            );
            renderLocales(filtrados);
        });

        // Inicializar renderizado
        renderLocales(locales);
    </script>
